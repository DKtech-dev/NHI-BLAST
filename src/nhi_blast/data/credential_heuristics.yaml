# Heuristics: literal credential recognition (H-LITERAL) and sink credential
# classification (H-SECRET-NAME). Patterns are deliberately simple and bounded so
# they stay linear on hostile input; no nested quantifiers.
source: "docs/SPEC.md sections 7.10, 4.2 and R10"
source_url: "https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions"
verified_on: "2026-10-25"
literal_credentials:
  - id: AWS_ACCESS_KEY_ID
    kind: AWS_ACCESS_KEY
    pattern: "(?:AKIA|ASIA)[0-9A-Z]{16}"
    boundary: alnum
  - id: GITHUB_TOKEN
    kind: GITHUB_TOKEN
    pattern: "gh[pousr]_[A-Za-z0-9]{36,}"
    boundary: none
  - id: GITHUB_PAT
    kind: GITHUB_TOKEN
    pattern: "github_pat_[A-Za-z0-9_]{22,}"
    boundary: none
  - id: SLACK_WEBHOOK
    kind: WEBHOOK_URL
    pattern: "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"
    boundary: none
  - id: SLACK_TOKEN
    kind: API_TOKEN
    pattern: "xox[abprs]-[A-Za-z0-9-]{10,}"
    boundary: none
  - id: PRIVATE_KEY
    kind: PRIVATE_KEY
    pattern: "-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----"
    boundary: none
secret_name_rules:
  - id: db_master
    pattern: "(?:^|[/_.-])(?:db|rds|database)[-_.]?(?:(?:master|root|admin)(?:[-_.]?(?:pass(?:word)?|secret|credential|pw))?|pass(?:word)?|secret|credential|pw)(?:$|[/_.-])"
    kind: DATABASE_PASSWORD
    criticality: 100
    rotation_hint: database_password
  - id: aws_access_key
    pattern: "(?:^|[/_.-])(?:aws[-_.]?)(?:access[-_.]?key|ak|key)(?:$|[/_.-])"
    kind: AWS_ACCESS_KEY
    criticality: 90
    rotation_hint: aws_access_key
  - id: private_key
    pattern: "(?:^|[/_.-])(?:private[-_.]?key|signing[-_.]?key|ssh[-_.]?key|deploy[-_.]?key)(?:$|[/_.-])"
    kind: PRIVATE_KEY
    criticality: 85
    rotation_hint: private_key
  - id: api_key
    pattern: "(?:^|[/_.-])(?:api[-_.]?key|live[-_.]?key|secret[-_.]?key|service[-_.]?key|stripe|openai|anthropic|datadog|sendgrid)(?:$|[/_.-])"
    kind: API_KEY
    criticality: 70
    rotation_hint: api_key
  - id: api_token
    pattern: "(?:^|[/_.-])(?:token|pat|access[-_.]?token|ci[-_.]?token|bot[-_.]?token|github[-_.]?token)(?:$|[/_.-])"
    kind: API_TOKEN
    criticality: 65
    rotation_hint: api_token
  - id: webhook
    pattern: "(?:^|[/_.-])(?:webhook|slack[-_.]?webhook|hook[-_.]?url)(?:$|[/_.-])"
    kind: WEBHOOK_URL
    criticality: 40
    rotation_hint: webhook
  - id: github_token
    pattern: "(?:^|[/_.-])(?:gh[-_.]?token|github[-_.]?pat|actions[-_.]?token)(?:$|[/_.-])"
    kind: GITHUB_TOKEN
    criticality: 30
    rotation_hint: github_token
default_kind_by_sink:
  secretsmanager_secret: GENERIC_SECRET
  ssm_parameter: GENERIC_SECRET
default_criticality:
  DATABASE_PASSWORD: 100
  AWS_ACCESS_KEY: 90
  PRIVATE_KEY: 85
  API_KEY: 70
  API_TOKEN: 65
  GENERIC_SECRET: 55
  WEBHOOK_URL: 40
  GITHUB_TOKEN: 30
  GITHUB_SECRET: 55
  OIDC_REQUEST_TOKEN: 10
  OIDC_JWT: 10
  STS_SESSION: 20

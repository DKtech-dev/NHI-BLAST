source_url: https://github.com/aws-actions/configure-aws-credentials
verified_on: "2026-11-02"
# The action's documented default for role-duration-seconds. It was read from the README
# and action.yml on the default branch. Only the refs listed here are treated as having
# that default; any other ref (a commit SHA, an older major, a branch) is ASSUMED.
action: aws-actions/configure-aws-credentials

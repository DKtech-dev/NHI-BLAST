name: build-windows

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  build:
    name: build / windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Pinned to full commit SHAs. The commits are older than 14 days.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
            requirements-dev.lock
            requirements-windows-build.lock
      - name: Install locked build environment
        shell: bash
        run: |
          python -m pip install -c requirements-dev.lock hatchling editables
          python -m pip install -c requirements-dev.lock --no-build-isolation -e ".[dev,rich,hcl]"
          python -m pip install -c requirements-dev.lock -c requirements-windows-build.lock pyinstaller==6.22.3
      - name: Build the standalone executable
        shell: bash
        run: python scripts/build_windows_exe.py
      - name: Inspect the executable and checksum
        shell: bash
        run: python scripts/check_artifacts.py dist/windows --windows-exe dist/windows/nhi-blast-windows-x64.exe
      - name: Verify the checksum independently
        shell: pwsh
        run: |
          $exe = "dist/windows/nhi-blast-windows-x64.exe"
          $record = (Get-Content "$exe.sha256" -Raw).Trim()
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($record -ne "$actual  nhi-blast-windows-x64.exe") {
            throw "SHA-256 checksum mismatch"
          }
      - name: Run executable parity and edge-case tests
        shell: bash
        env:
          NHI_BLAST_WINDOWS_EXE: ${{ github.workspace }}/dist/windows/nhi-blast-windows-x64.exe
        run: |
          REFERENCE=$(python -c "import shutil; print(shutil.which('nhi-blast'))")
          test -n "$REFERENCE"
          export NHI_BLAST_REFERENCE_CLI="$REFERENCE"
          python -m pytest -q tests/test_windows_executable.py tests/test_windows_packaging.py \
            tests/test_artifacts.py tests/test_ci_pins.py
      - name: Upload the executable and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nhi-blast-windows-x64
          path: |
            dist/windows/nhi-blast-windows-x64.exe
            dist/windows/nhi-blast-windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

name: ci

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      # Pinned to full commit SHAs. Both commits are older than 14 days.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: Install locked toolchain
        run: |
          python -m pip install -c requirements-dev.lock hatchling editables
          python -m pip install -c requirements-dev.lock --no-build-isolation -e ".[dev,rich,hcl]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Format
        run: python -m ruff format --check src tests scripts
      - name: Types
        run: python -m mypy src
      - name: Report schema drift
        run: python scripts/gen_schema.py --check
      - name: Full test suite
        run: python -m pytest -q
      - name: Coverage gate
        run: python scripts/check_coverage.py
      - name: Performance gate
        run: python -m pytest -q -m slow

  package:
    name: package / wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: Install locked build tooling
        run: python -m pip install -c requirements-dev.lock hatchling
      - name: Build distributions
        run: |
          python -m hatchling build -t wheel -d dist
          python -m hatchling build -t sdist -d dist
          python scripts/check_artifacts.py dist
      - name: Install the wheel into a clean consumer environment
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install -q -c requirements.lock dist/*.whl
          "$RUNNER_TEMP/consumer/bin/nhi-blast" version
          "$RUNNER_TEMP/consumer/bin/nhi-blast" version --data
          "$RUNNER_TEMP/consumer/bin/nhi-blast" schema > "$RUNNER_TEMP/schema.json"
      - name: Exercise the installed CLI on a real fixture
        run: |
          "$RUNNER_TEMP/consumer/bin/nhi-blast" scan tests/fixtures/fx07-incident \
            --simulate-compromise "action:tj-actions/changed-files@v45" \
            --format json --format sarif --format html \
            --out "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/consumer/bin/nhi-blast" rank tests/fixtures/fx07-incident \
            --format json --out "$RUNNER_TEMP/rank"
          "$RUNNER_TEMP/consumer/bin/nhi-blast" export tests/fixtures/fx07-incident \
            --format dot --out "$RUNNER_TEMP/export"
          FINDING=$("$RUNNER_TEMP/consumer/bin/python" -c \
            "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['findings'][0]['id'])" \
            "$RUNNER_TEMP/out/report.json")
          "$RUNNER_TEMP/consumer/bin/nhi-blast" explain "$FINDING" --report "$RUNNER_TEMP/out/report.json" > /dev/null

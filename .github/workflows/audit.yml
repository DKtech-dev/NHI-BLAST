name: audit

"on":
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  dependency-and-secret-audit:
    name: advisory / dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to full commit SHAs. Both commits are older than 14 days.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-audit.lock
      - name: Install audit tooling
        run: python -m pip install --require-hashes -r requirements-audit.lock
      - name: Audit runtime lock
        run: python -m pip_audit -r requirements.lock
      - name: Audit development lock
        run: python -m pip_audit -r requirements-dev.lock
      - name: Static application security scan
        run: python -m bandit -q -r src -ll
      - name: OSV dependency scan
        env:
          OSV_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
          GH_TOKEN: ${{ github.token }}
        run: |
          # Asset 632251666 is osv-scanner v2.7.0 linux_amd64. The API asset
          # endpoint serves the pinned bytes when the release CDN path 504s.
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/osv-scanner" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/google/osv-scanner/releases/assets/632251666"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          mkdir -p "$RUNNER_TEMP/osv"
          cp requirements.lock "$RUNNER_TEMP/osv/requirements.txt"
          cp requirements-dev.lock "$RUNNER_TEMP/osv/requirements-dev.txt"
          "$RUNNER_TEMP/osv-scanner" scan source -r "$RUNNER_TEMP/osv"
      - name: Secret scan
        env:
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GH_TOKEN: ${{ github.token }}
        run: |
          # Asset 378332058 is gitleaks v8.30.1 linux_x64 (same CDN workaround).
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --config .gitleaks.toml

# Release pipeline. A tag push builds and checks the distributions, attests them, and creates a
# DRAFT GitHub release; it never publishes to a package index. TestPyPI/PyPI publication runs only
# through an explicit workflow_dispatch choice and the owner-protected environments.
name: release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after the build (the protected environments still need approval)"
        type: choice
        options:
          - none
          - testpypi
          - pypi
        default: none

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  build:
    name: build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to full commit SHAs. The commits are older than 14 days.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
            requirements-dev.lock
      - name: Install the locked build tooling
        run: python -m pip install -c requirements-dev.lock hatchling
      - name: Build the wheel and sdist reproducibly
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m hatchling build -t wheel -t sdist -d dist
      - name: Inspect the distributions
        run: python scripts/check_artifacts.py dist
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install -c requirements.lock dist/*.whl
          "$RUNNER_TEMP/smoke/bin/nhi-blast" version
          "$RUNNER_TEMP/smoke/bin/nhi-blast" scan tests/fixtures/fx07-incident \
            --repo-slug acme/shop --format json --format sarif --format html \
            --fail-on never --out "$RUNNER_TEMP/smoke-out"
          test -s "$RUNNER_TEMP/smoke-out/report.json"
          test -s "$RUNNER_TEMP/smoke-out/report.sarif"
          test -s "$RUNNER_TEMP/smoke-out/report.html"
      - name: Write checksums and the CycloneDX SBOM
        run: |
          mkdir release-meta
          (cd dist && sha256sum -- *.whl *.tar.gz) > release-meta/SHA256SUMS
          python -m pip install cyclonedx-bom==7.6.0
          cyclonedx-py environment --of JSON -o release-meta/sbom.cdx.json \
            "$RUNNER_TEMP/smoke/bin/python"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-meta
          path: release-meta/
          if-no-files-found: error
          retention-days: 14

  attest:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*

  publish-testpypi:
    name: publish to TestPyPI
    needs: [build, attest]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nhi-blast
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: publish to PyPI
    needs: publish-testpypi
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nhi-blast
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/

  draft-release:
    name: draft the GitHub release
    needs: [build, attest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-meta
          path: release-meta
      - name: Create a draft release (it is never published by this workflow)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "Draft. Verify the attestations and checksums before publishing." \
            dist/*.whl dist/*.tar.gz release-meta/SHA256SUMS release-meta/sbom.cdx.json

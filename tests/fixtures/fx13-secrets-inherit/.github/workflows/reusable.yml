name: Reusable deploy
on:
  workflow_call:
    secrets:
      DEPLOY_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  inner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@abcdef0123456789abcdef0123456789abcdef01
      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: ./scripts/deploy.sh

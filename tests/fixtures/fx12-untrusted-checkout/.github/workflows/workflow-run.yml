name: Post-CI
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@abcdef0123456789abcdef0123456789abcdef01
        with:
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
      - name: Run PR-provided triage script
        run: ./scripts/triage.sh
      - uses: aws-actions/configure-aws-credentials@abcdef0123456789abcdef0123456789abcdef02
        with:
          role-to-assume: arn:aws:iam::111122223333:role/main-ci
          aws-region: us-east-1
